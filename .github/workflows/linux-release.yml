name: Linux release

# Publishes a release when the version in app/package.json on the linux branch
# has no release yet. The upstream sync workflow calls this after merging a new
# upstream release; a Linux-only fix is released by bumping the -linuxN suffix.
# Everything is built here, in CI, and attested with GitHub's build provenance.

on:
  push:
    branches:
      - linux
    paths:
      - app/package.json
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: linux-release
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are only visible with write access.
      contents: write
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'linux' }}
          persist-credentials: false

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./app/package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-linux[0-9]+$ ]]; then
            echo "::error::Version '$version' should look like 3.6.6-linux1"
            exit 1
          fi
          tag="release-$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            needed=false
          else
            needed=true
          fi
          {
            echo "needed=$needed"
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$version"
            echo "tag=$tag"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build
    needs: check
    if: needs.check.outputs.needed == 'true'
    uses: ./.github/workflows/linux-ci.yml
    with:
      ref: ${{ needs.check.outputs.sha }}
    permissions:
      contents: read

  arch-package:
    name: Test Arch package
    needs: [check, build]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist

      - name: Build package from the generated PKGBUILD
        run: |
          pacman -Syu --noconfirm --needed desktop-file-utils xorg-server-xvfb xorg-xauth
          useradd -m builder
          install -d -o builder /tmp/pkg
          script/linux/aur/make-pkgbuild.sh "$VERSION" dist >/tmp/pkg/PKGBUILD
          cp "dist/GitHubDesktop-linux-amd64-$VERSION.deb" /tmp/pkg/
          chown -R builder /tmp/pkg
          su builder -c 'cd /tmp/pkg && makepkg --nodeps --noconfirm'

      - name: Install and check the package
        run: |
          pacman -U --noconfirm /tmp/pkg/github-desktop-bin-*.pkg.tar.zst
          desktop-file-validate /usr/share/applications/github-desktop.desktop
          test -x /usr/bin/github-desktop
          if ldd /opt/github-desktop/github-desktop | grep 'not found'; then
            echo "::error::Libraries missing from the PKGBUILD depends"
            exit 1
          fi
          # Containers block the user namespaces Chromium's sandbox needs.
          su builder -c "script/linux/smoke-test.sh /usr/bin/github-desktop --no-sandbox"

  publish:
    name: Publish release
    needs: [check, build, arch-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist

      - name: Write PKGBUILD and checksums
        run: |
          script/linux/aur/make-pkgbuild.sh "$VERSION" dist >dist/PKGBUILD
          (cd dist && sha256sum -- * >SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Write release notes
        run: |
          upstream="${VERSION%-linux*}"
          repo="$GITHUB_REPOSITORY"
          cat >notes.md <<NOTES
          Unofficial community build of [GitHub Desktop](https://github.com/desktop/desktop) for Linux. Not affiliated with or endorsed by GitHub.

          Based on **GitHub Desktop $upstream** ([upstream release notes](https://github.com/desktop/desktop/releases/tag/release-$upstream)) with the Linux support from [shiftkey/desktop](https://github.com/shiftkey/desktop).

          ### Install

          - **AppImage** runs on any distribution: \`chmod +x\` it and start it.
          - **.deb** for Debian and Ubuntu, **.rpm** for Fedora and openSUSE.
          - **.tar.gz** is the plain app folder; run \`github-desktop\` inside it.
          - Files for x86_64 and arm64 are attached below.

          **Arch Linux:** download \`PKGBUILD\` into an empty folder and run \`makepkg -si\`. It is a drop-in replacement for the AUR \`github-desktop-bin\` package.

          ### Verify

          Every file was built by GitHub Actions from commit $SHA and carries a signed build provenance attestation:

          \`\`\`
          gh attestation verify <file> --repo $repo
          sha256sum -c SHA256SUMS --ignore-missing
          \`\`\`
          NOTES

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ vars.PUBLISH_RELEASES }}
        run: |
          draft=(--draft)
          if [[ "$PUBLISH" == true ]]; then
            draft=()
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "GitHub Desktop $VERSION for Linux (community build)" \
            --notes-file notes.md \
            "${draft[@]}"
